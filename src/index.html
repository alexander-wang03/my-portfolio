<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alexander Wang</title>
    <meta name="description" content="Portfolio of Alexander Wang — engineer, pilot, and creator. Explore my world by driving a rover across Mars.">
    <meta name="keywords" content="Alexander Wang, portfolio, robotics, AI, engineer, University of Toronto, TRAIL, TARS-AI, aUToronto">
    <meta name="author" content="Alexander Wang">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Alexander Wang">
    <meta property="og:description" content="Explore my world by driving a rover across Mars.">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Alexander Wang">
    <meta name="twitter:description" content="Explore my world by driving a rover across Mars.">

    <!-- Canonical link and the absolute URLs, injected at build time from
         SITE_URL in content/portfolio.ts. See the seoFiles plugin. -->
    <!--absolute-urls-->

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" media="(prefers-color-scheme: light)">
    <link rel="icon" href="/favicon-dark.ico" media="(prefers-color-scheme: dark)">

    <!-- Set before first paint so the plain-HTML fallback below never flashes
         for visitors who are getting the 3D world. -->
    <script>document.documentElement.classList.add('has-js')</script>

    <link rel="stylesheet" href="./style/main.css">
</head>
<body>
    <!-- First in tab order, so assistive tech and keyboard users reach the
         readable version before anything else. Hidden until focused. -->
    <a class="skip-link" href="#fallback">Skip the 3D world &mdash; view the text version</a>

    <!-- Filled in at build time from portfolio.ts. Static markup on purpose:
         built in JS it could not appear until the application bundle had
         downloaded, which is the wait it exists to cover. -->
    <!--loading-screen-->

    <!-- Nothing here is describable, so keep it out of the accessibility tree -->
    <canvas class="js-canvas" aria-hidden="true"></canvas>

    <!-- Deliberately outside the fallback, which JS hides: CC BY and MIT both
         require attribution to travel with the work itself, so this has to
         stay visible to someone playing the 3D world. See CREDITS.md. -->
    <footer class="credits">
        <!-- Focusable so a click or a tab brings the full line back: the
             reveal is :focus-within, which needs something to focus. -->
        <button class="credits-tag" type="button" aria-label="Show asset credits">Credits</button>
        <span class="credits-text">
        Rover model
        <a href="https://sketchfab.com/3d-models/mars-rover-character-9cbf5d8c68e140b28916739705520901"
           rel="noopener" target="_blank">&ldquo;Mars Rover Character&rdquo;</a>
        by BrentNoll, licensed
        <a href="https://creativecommons.org/licenses/by/4.0/"
           rel="license noopener" target="_blank">CC&nbsp;BY&nbsp;4.0</a>, modified.
        Matcaps and impact sounds from
        <a href="https://github.com/brunosimon/folio-2019"
           rel="noopener" target="_blank">folio-2019</a>
        by Bruno Simon (MIT).
        </span>
    </footer>

    <script type="module" src="./main.ts"></script>
</body>
</html>
